name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fail if uv.lock is out of date instead of silently re-locking.
  UV_LOCKED: "1"
  PYTHON_VERSION: "3.12"
  TERRAFORM_VERSION: "1.16.5"
  TFLINT_VERSION: "v0.64.0"
  CHECKOV_VERSION: "3.3.26"
  DX_LOG_FORMAT: text
  DX_LOG_LEVEL: WARNING

jobs:
  lint:
    name: lint, lockfile, secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: uv.lock is in sync with pyproject.toml
        run: uv lock --check
      - run: uv sync --only-group dev --no-install-project
      - name: ruff check
        run: uv run --no-sync ruff check --output-format=github .
      - name: ruff format
        run: uv run --no-sync ruff format --check .
      - name: Committed fixtures stay small (< 300 KB each)
        run: |
          big=$(find tests/fixtures -type f -size +300k)
          if [ -n "$big" ]; then echo "too large: $big"; exit 1; fi
      - name: gitleaks (full history)
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose

  unit:
    name: unit + AWS code paths on moto
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync
      - name: pytest (unit + aws/moto) with coverage
        run: uv run pytest tests/unit tests/aws --cov --cov-report=term --cov-report=xml -q
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml

  pipeline:
    name: pipeline on recorded fixtures (extract -> curate -> dbt build -> DQ -> site)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DX_SOURCE: fixtures
      DX_DATA_DIR: /tmp/dx-fixture-run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync
      - name: Full pipeline (exit 3 = data-quality gate)
        run: uv run dx run
      - name: Rerun is a no-op downstream
        run: uv run dx run
      - name: Data-quality checks, curated + marts
        run: uv run dx dq
      - name: dbt build again directly (tests every model)
        run: uv run dx transform
      - name: End-to-end tests (idempotency, full refresh, incremental pick-up, DQ gates)
        run: uv run pytest tests/e2e -q
      - name: Results site from the fixtures
        run: uv run dx report --out site
      - name: dbt docs
        run: uv run dx transform --command docs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixture-site-and-dbt-docs
          path: |
            site
            dbt/target/index.html
            dbt/target/manifest.json
            dbt/target/catalog.json

  dbt-athena:
    name: dbt compile for Athena (adapter against a moto endpoint, no AWS)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DX_SOURCE: fixtures
      DX_DATA_DIR: /tmp/dx-athena-compile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync
      - run: uv run python scripts/dbt_athena_compile.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: athena-compiled-sql
          path: dbt/target/compiled

  terraform:
    name: terraform fmt, validate, tflint, checkov
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --recursive --format compact
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: checkov (every skip is justified inline)
        run: uvx --from "checkov==${CHECKOV_VERSION}" checkov -d . --framework terraform --quiet --compact

  lambda-artifacts:
    name: build Lambda zip + curate image (not pushed)
    # Native arm64 runner: the functions run on Graviton (arm64), so no QEMU emulation.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    needs: [lint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Extractor zip (stdlib + runtime boto3 only)
        run: uv run python scripts/package_lambda.py
      - name: Curate image requirements pinned from uv.lock
        run: make curate-requirements
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build curate image (arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/lambda/curate.Dockerfile
          platforms: linux/arm64
          tags: dx-curate:ci
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extract-lambda-zip
          path: dist/extract_lambda.zip

  localstack:
    name: AWS mode against LocalStack (S3 raw zone, DynamoDB watermarks, Iceberg on S3)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      localstack:
        # Pinned: newer LocalStack images need an auth token. If LOCALSTACK_AUTH_TOKEN is set as a
        # repository secret it is passed through and any image works.
        image: localstack/localstack:4.4.0
        ports:
          - 4566:4566
        env:
          SERVICES: s3,dynamodb,sts,secretsmanager
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      LOCALSTACK_ENDPOINT: http://localhost:4566
      # The Glue Data Catalog is not in LocalStack's free tier: use the SQL catalog with the
      # warehouse on LocalStack S3. Glue itself is covered by the moto test in the unit job.
      LOCALSTACK_ICEBERG_CATALOG: sql
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync
      - run: curl -s http://localhost:4566/_localstack/health
      - name: Lambda handlers end to end against LocalStack
        run: uv run pytest tests/aws -k full_aws_mode -v
