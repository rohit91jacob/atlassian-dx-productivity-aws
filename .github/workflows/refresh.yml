name: refresh

# Daily data refresh: incremental extraction from the ASF Jira (no credentials) and the GitHub
# REST API (the run's built-in GITHUB_TOKEN, read-only, public data), curate -> dbt build -> DQ,
# then publish the results site to GitHub Pages. The lake (raw zone, watermarks, Iceberg
# warehouse) is kept in the Actions cache between runs so extraction stays incremental.
# This workflow uses the local emulation backend; it touches no cloud account.

on:
  schedule:
    # Daily: both sources change continuously, and the results site is a daily view.
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "Rebuild the curated tables from every raw object"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: refresh
  cancel-in-progress: false

env:
  UV_LOCKED: "1"
  PYTHON_VERSION: "3.12"
  DX_DATA_DIR: /home/runner/dx-lake
  DX_LOG_FORMAT: json
  DX_SOURCE: live
  # First run backfills this much history; afterwards runs continue from the watermarks.
  DX_JIRA_LOOKBACK_DAYS: "90"
  DX_GITHUB_LOOKBACK_DAYS: "30"
  # The Actions token allows 1,000 REST requests/hour per repository; leave headroom.
  DX_GITHUB_MAX_REQUESTS: "900"
  # Private pseudonymisation salt. Without the secret the public default salt is used, with
  # which anyone can re-identify a login by hashing candidates. Set it before the first run (or
  # run once with full_refresh after setting it) so pseudonyms stay consistent across runs.
  DX_PSEUDONYM_SALT: ${{ secrets.DX_PSEUDONYM_SALT }}

jobs:
  build:
    name: refresh lake + build site
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Restore the lake from the previous run
        id: lake
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DX_DATA_DIR }}
          key: dx-lake-${{ github.run_id }}
          restore-keys: dx-lake-
      - name: Report lake state
        run: |
          if [ -n "${{ steps.lake.outputs.cache-matched-key }}" ]; then
            echo "restored from: ${{ steps.lake.outputs.cache-matched-key }}"; du -sh "$DX_DATA_DIR"
          else
            echo "restored from: nothing (first run: backfill from the lookback window)"
          fi
      - run: uv sync
      - name: Extract (Jira + GitHub, incremental)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run dx extract
      - name: Save the lake right after extraction (watermarks survive a later failure)
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DX_DATA_DIR }}
          key: dx-lake-${{ github.run_id }}-1-extracted
      - name: Curate -> dbt build -> mart DQ (exit 3 = data-quality failure)
        run: uv run dx run --skip-extract ${{ inputs.full_refresh && '--full-refresh' || '' }}
      - name: Save the lake with the curated tables
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DX_DATA_DIR }}
          key: dx-lake-${{ github.run_id }}-2-curated
      - name: Reconcile with published figures (live; mismatches are reported, not fatal)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run dx verify --out verification-run.md || echo "verification could not run"
      - name: Build the results site
        run: |
          uv run dx report --out site
          [ -f verification-run.md ] && cp verification-run.md site/verification.md
          echo "### Results site" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          python3 -c "import json; print(json.dumps(json.load(open('site/summary.json'))['headline'], indent=2))" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: publish to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  alert:
    name: open or update a failure issue
    needs: [build, deploy]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: Scheduled refresh is failing
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or comment on the tracking issue
        run: |
          body="The scheduled \`refresh\` run failed: $RUN_URL

          See docs/runbook.md#scheduled-refresh-fails. Close this issue once a run is green."
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
